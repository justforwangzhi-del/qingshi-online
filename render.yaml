services:
  - type: web
    name: qingshi-online
    runtime: docker
    healthCheckPath: /healthz
    envVars:
      - key: ACCESS_USERNAME
        value: qingshi
      - key: ACCESS_PASSWORD
        generateValue: true
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: MIMO_API_KEY
        sync: false
