<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>轻识 · 在线文档识别</title>
<style>
:root{font-family:Inter,"Segoe UI","Microsoft YaHei",sans-serif;color:#252830;background:#f8f9fb;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh}body:before{content:"";position:fixed;inset:0;z-index:-1;background:radial-gradient(ellipse 57% 44% at 52% 65%,#c5e3fc 0%,#e7f3fd 55%,#f8f9fb 100%)}button,textarea,select{font:inherit}button{cursor:pointer;border:0;background:none;color:inherit}button:disabled{cursor:not-allowed;opacity:.4}button:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #8bb9ec;outline-offset:4px}header{height:90px;padding:26px 42px;display:flex;align-items:center;justify-content:space-between}.brand{display:flex;align-items:center;gap:11px;font-weight:600;letter-spacing:2px}.mark{display:grid;place-items:center;width:32px;height:32px;border:1px solid #a9bfda;border-radius:11px;color:#536e93;background:#ffffff80}.connection{display:flex;align-items:center;gap:8px;font-size:12px;color:#78828f;letter-spacing:0}.dot{width:6px;height:6px;border-radius:50%;background:#c09a49}.dot.ok{background:#59a481}.retry{color:#607da7;padding:7px}.hero{width:min(970px,calc(100% - 48px));margin:0 auto;padding-top:clamp(100px,23vh,260px);transition:padding .35s}.eyebrow{font-size:11px;letter-spacing:3px;text-align:center;color:#8e9aab;margin-bottom:20px}h1{font-size:clamp(30px,4.1vw,49px);font-weight:350;letter-spacing:1px;text-align:center;margin:0 0 18px}.subtitle{font-size:14px;color:#8993a0;text-align:center;margin:0 0 45px}.composer{border:1px solid #fff;background:#ffffffef;border-radius:38px;box-shadow:0 7px 20px #547ba011,0 2px 5px #31588009;padding:13px 18px 13px 19px;transition:box-shadow .2s}.composer:focus-within{box-shadow:0 7px 27px #547ba01d}.bar{display:flex;align-items:center;gap:14px}.icon{width:40px;height:40px;display:grid;place-items:center;border-radius:50%;flex-shrink:0}.icon:hover{background:#eef4fb}.icon svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}textarea{flex:1;min-width:0;resize:none;border:0;outline:0;background:transparent;font-size:18px;line-height:28px;padding:8px 0;color:#333842;max-height:140px}textarea::placeholder{color:#8a9099}select{max-width:160px;border:0;outline:0;background:transparent;color:#6d7889;font-size:13px;padding:8px 2px;cursor:pointer}.send{background:#2e3542;color:white}.send:hover{background:#47556c}.attachment{display:flex;align-items:center;gap:12px;margin:2px 0 10px 9px;padding:8px;border:1px solid #e7edf4;border-radius:17px;width:fit-content;max-width:95%}.attachment[hidden]{display:none}.attachment img{width:49px;height:49px;border-radius:9px;object-fit:cover}.filename{font-size:12px;max-width:300px;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}.filesize{font-size:11px;color:#97a0ae;margin-top:5px}.remove{font-size:21px;color:#8993a0;padding:8px}.presets{display:flex;justify-content:center;gap:10px;margin-top:23px;flex-wrap:wrap}.preset{border:1px solid #b6c8dd66;padding:10px 17px;border-radius:23px;color:#68798f;background:#ffffff40;font-size:12px;transition:.2s}.preset:hover,.preset.active{background:#ffffffcc;border-color:#9bb7d5;color:#3e5f85}.hint{text-align:center;font-size:11px;color:#99a3af;margin-top:24px;line-height:1.9}.hint strong{font-weight:400;color:#8493a6}.message{min-height:22px;margin-top:18px;text-align:center;font-size:13px;color:#9e594f}.results{margin:0 auto 60px;width:min(1060px,calc(100% - 48px));display:none}.working .hero,.has-result .hero{padding-top:45px}.working h1,.has-result h1{font-size:32px}.working .subtitle,.has-result .subtitle{margin-bottom:26px}.working .results,.has-result .results{display:block}.result-top{display:flex;justify-content:space-between;align-items:center;margin:22px 0 14px;gap:12px}.result-title{font-size:14px;font-weight:500}.progress{font-size:12px;color:#8390a1;margin-left:12px}.actions{display:flex;gap:8px}.action{background:#ffffff99;border:1px solid #dce5ef;border-radius:12px;padding:9px 13px;font-size:12px;color:#65768c}.workspace{display:grid;grid-template-columns:40% 60%;border:1px solid #ffffffdd;background:#ffffffa6;border-radius:24px;overflow:hidden;box-shadow:0 8px 35px #6f8fa00b;min-height:310px}.preview{background:#ecf2f86b;padding:22px;display:flex;align-items:flex-start;justify-content:center;border-right:1px solid #e1e9f2;max-height:660px;overflow:auto}.preview img{max-width:100%;height:auto;border-radius:8px;box-shadow:0 2px 15px #303d4d12}.output{padding:25px;min-width:0;max-height:660px;overflow:auto}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-family:inherit;font-size:14px;line-height:1.9;margin:0;color:#3c4552}.empty{color:#a2aab4;font-size:13px;line-height:2}.spinner{display:inline-block;width:12px;height:12px;border:1.5px solid #bdcde0;border-top-color:#607da0;border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes spin{to{transform:rotate(360deg)}}.drop-overlay{display:none;position:fixed;inset:14px;border:2px dashed #82a9d2;border-radius:25px;background:#eaf5fff2;z-index:10;place-items:center;font-size:26px;color:#547ca7;pointer-events:none}.dragging .drop-overlay{display:grid}footer{text-align:center;font-size:10px;letter-spacing:1px;color:#a3adba;margin:35px 0 25px} @media(max-width:650px){header{padding:20px;height:75px}.hero{width:calc(100% - 30px);padding-top:20vh}.eyebrow{font-size:10px}h1{font-size:31px}.subtitle{font-size:12px;line-height:1.8}.bar{gap:6px}.composer{padding:10px;border-radius:28px}textarea{font-size:15px}select{max-width:105px;font-size:11px}.icon{width:34px;height:34px}.workspace{grid-template-columns:1fr}.preview{max-height:220px;border-right:0;border-bottom:1px solid #e1e9f2}.preview img{max-height:180px;object-fit:contain}.results{width:calc(100% - 30px)}.result-top{flex-wrap:wrap}.filename{max-width:180px}.connection{font-size:10px}.progress{margin-left:6px}}
[hidden]{display:none!important}
.actions{flex-wrap:wrap;justify-content:flex-end}.result-top{flex-wrap:wrap}#word-mode{font-size:11px;max-width:200px}header{height:auto;min-height:90px;gap:15px;flex-wrap:wrap}.connection{flex-wrap:wrap;justify-content:flex-end}dialog{border:1px solid #dce5ef;border-radius:24px;padding:28px;width:min(550px,calc(100% - 30px));color:#35445a;background:#fbfdff;box-shadow:0 18px 80px #3b577e30}dialog::backdrop{background:#22334b50;backdrop-filter:blur(4px)}dialog h2{font-size:21px;font-weight:500;margin:0 0 15px}dialog label{display:flex;flex-direction:column;gap:8px;font-size:12px;margin:18px 0;color:#6c7d91}dialog input,dialog select{font:inherit;font-size:14px;padding:11px 12px;max-width:none;width:100%;border:1px solid #dce5ef;border-radius:11px;background:white;color:#35445a}.settings-tip{font-size:12px;line-height:1.9;color:#8290a1}.settings-actions{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}#provider{max-width:175px}#cloud-consent{accent-color:#608cb9}#api-settings{font-size:11px}
</style>
</head>
<body>
<header><div class="brand"><span class="mark">识</span>轻识</div><div class="connection"><select id="provider" aria-label="模型服务"><option value="deepseek">DeepSeek API</option><option value="mimo">MiMo API</option></select><span class="dot" id="dot"></span><span id="status">正在检查在线服务</span><button class="retry" id="retry" title="重新检查连接" aria-label="重新检查连接">↻</button></div></header>
<main>
<section class="hero">
<div class="eyebrow">QINGSHI · ONLINE STUDIO</div><h1>想从文档中读出些什么？</h1><p class="subtitle">把文字留下，让整理更轻一点。</p>
<form id="form" class="composer">
<div class="attachment" id="attachment" hidden><img id="thumb" alt="待识别图片缩略图"><div><div class="filename" id="filename"></div><div class="filesize" id="filesize"></div></div><button type="button" class="remove" id="remove" aria-label="移除图片">×</button></div>
<div id="pdf-options" hidden style="margin:8px 12px 16px;color:#74839a;font-size:12px">识别页码 <input id="page-start" type="number" min="1" value="1" aria-label="起始页" style="width:65px;margin:0 8px;padding:5px;border:1px solid #dce5ef;border-radius:7px">至 <input id="page-end" type="number" min="1" value="1" aria-label="结束页" style="width:65px;margin:0 8px;padding:5px;border:1px solid #dce5ef;border-radius:7px"><span id="page-total"></span></div><div class="bar"><button type="button" class="icon" id="upload" title="添加图片" aria-label="添加图片"><svg viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></svg></button><textarea rows="1" id="prompt" aria-label="识别要求" placeholder="添加图片或 PDF，说说你的识别要求…"></textarea><select id="mode" aria-label="识别方式"><option value="text">文字识别</option><option value="table">表格提取</option><option value="custom">自定义要求</option></select><button class="icon send" id="send" type="submit" title="开始识别" aria-label="开始识别"><svg viewBox="0 0 24 24"><path d="m5 12 7-7 7 7M12 5v15"/></svg></button><button class="icon" id="stop" type="button" hidden aria-label="停止识别" title="停止识别"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg></button></div>
</form>
<input type="file" id="file" accept="image/png,image/jpeg,image/webp,application/pdf,.pdf" hidden>
<div class="presets"><button class="preset active" data-mode="text">提取图片文字</button><button class="preset" data-mode="table">还原表格结构</button><button class="preset" id="pasteTip">粘贴截图 Ctrl + V</button></div>
<div id="cloud-note" hidden style="text-align:center;font-size:12px;color:#7c7184;line-height:1.8;margin-top:20px"><label><input type="checkbox" id="cloud-consent"> 允许将本次图片或所选PDF页面发送至 <span id="cloud-name"></span> 识别，可能产生API费用</label></div><p class="hint">支持 PDF（30MB / 100页以内）、PNG、JPG、WebP · 拖入文件或粘贴截图<br><strong><span id="privacy-hint">文件由本站服务器处理，所选页面会发送至模型平台</span></strong></p><div class="message" id="message" role="status" aria-live="polite"></div>
</section>
<section class="results" aria-label="识别结果"><div class="result-top"><div><span class="result-title">识别结果</span><span class="progress" id="progress"></span></div><div class="actions"><button class="action" id="copy" disabled>复制文字</button><button class="action" id="download" disabled>下载 Markdown</button><select id="word-mode" aria-label="Word导出方式" title="原始页面保留完整签名和印章"><option value="both">文字＋原件（含签章）</option><option value="original">仅原件（含签章）</option></select><button class="action" id="word" disabled>导出 Word</button><button class="action" id="reset">重新开始</button></div></div><div class="workspace"><div class="preview"><img id="preview" alt="原始图片预览"></div><div class="output"><div class="empty" id="empty">正在准备识别…首次加载可能需要一点时间。</div><pre id="result" aria-live="off"></pre></div></div></section>
</main><footer>轻识 · 在线文档识别</footer><div class="drop-overlay">松开鼠标，添加图片</div>
<script>
const $=id=>document.getElementById(id);let file=null,image='',objectUrl='',controller=null,busy=false,ready=false,raw='',timer=null;
let activeProvider='deepseek';let exportState=null;let pdf=null,preparing=false,currentLabel='';
const defaults={text:'请识别图片中的所有文字，保留原始阅读顺序、段落和表格，以 Markdown 输出。只输出识别内容，不要补充图片中没有的信息。',table:'请提取图片中的表格，以 Markdown 表格输出。保留表头、行列对应关系和所有数值。不要编造缺失内容。'};
function message(t){$('message').textContent=t}
let configs={};
async function loadConfigs(){const r=await fetch('/api/provider-config');if(!r.ok)throw new Error('配置读取失败');configs=await r.json()}
async function check(){const provider=$('provider').value;try{await loadConfigs();ready=!!configs[provider]?.has_key;$('status').textContent=ready?'在线服务已配置':'管理员尚未配置此平台';$('dot').classList.toggle('ok',ready)}catch{$('status').textContent='在线服务连接失败';ready=false}}
$('retry').onclick=check;check();
function mode(v){$('mode').value=v;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('active',b.dataset.mode===v))}
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>mode(b.dataset.mode));$('mode').onchange=()=>mode($('mode').value);
$('upload').onclick=()=>$('file').click();$('pasteTip').onclick=()=>{message('复制一张截图后，在本页面按 Ctrl + V 即可添加。');$('prompt').focus()};
async function add(f){if(preparing)return;if(f&&(f.type==='application/pdf'||/\.pdf$/i.test(f.name))){return addPdf(f)}if(busy)return message('请先停止当前识别，再更换图片。');if(!f)return;if(!['image/png','image/jpeg','image/webp'].includes(f.type))return message('请选择 PNG、JPG 或 WebP 图片。');if(f.size>15*1024*1024)return message('图片超过15MB，请压缩后再试。');try{const data=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(f)});const probe=new Image();probe.src=data;await probe.decode();if(probe.width*probe.height>25000000)return message('图片分辨率过大，请缩小到2500万像素以内。');pdf=null;$('pdf-options').hidden=true;file=f;image=data.split(',')[1];if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=URL.createObjectURL(f);$('thumb').src=$('preview').src=objectUrl;$('filename').textContent=f.name||'粘贴的截图.png';$('filesize').textContent=`${probe.width} × ${probe.height} · ${(f.size/1024).toFixed(0)} KB`;$('attachment').hidden=false;message('');$('prompt').focus()}catch{message('图片读取失败，请重新选择。')}}
$('file').onchange=e=>{add(e.target.files[0]);e.target.value=''};$('remove').onclick=()=>{if(busy)return;file=null;image='';pdf=null;$('pdf-options').hidden=true;$('attachment').hidden=true;if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl=''};
document.addEventListener('paste',e=>{const f=[...(e.clipboardData?.items||[])].find(i=>i.type.startsWith('image/'));if(f){e.preventDefault();add(f.getAsFile())}});
let dragDepth=0;document.addEventListener('dragenter',e=>{if([...e.dataTransfer.types].includes('Files')){e.preventDefault();dragDepth++;document.body.classList.add('dragging')}});document.addEventListener('dragover',e=>e.preventDefault());document.addEventListener('dragleave',()=>{if(--dragDepth<=0)document.body.classList.remove('dragging')});document.addEventListener('drop',e=>{e.preventDefault();dragDepth=0;document.body.classList.remove('dragging');add(e.dataTransfer.files[0])});
$('prompt').oninput=()=>{$('prompt').style.height='auto';$('prompt').style.height=Math.min($('prompt').scrollHeight,140)+'px'};$('prompt').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('form').requestSubmit()}};
function clean(s){return s.replace(/<think>[\s\S]*?<\/think>/g,'').replace(/<\/?think>/g,'').trimStart()}
function controls(on){busy=on;$('send').hidden=on;$('stop').hidden=!on;['upload','remove','mode','reset','provider'].forEach(id=>$(id).disabled=on);$('copy').disabled=$('download').disabled=on||!clean(raw).trim();$('word').disabled=on||!exportState?.pages.length;document.body.classList.toggle('working',on)}

async function readData(f){return await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result.split(',')[1]);r.onerror=reject;r.readAsDataURL(f)})}
async function addPdf(f){if(busy)return message('请先停止当前识别。');if(f.size>30*1024*1024)return message('PDF不能超过30MB。');preparing=true;$('send').disabled=true;message('正在读取PDF…');try{const r=await fetch('/api/pdf',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pdf:await readData(f)})});const d=await r.json();if(!r.ok)throw new Error(d.error);const pr=await fetch(`/api/pdf-page?token=${encodeURIComponent(d.token)}&page=1`);const page=await pr.json();if(!pr.ok)throw new Error(page.error);pdf=d;file=f;image='';if(objectUrl)URL.revokeObjectURL(objectUrl);objectUrl='';$('thumb').src=$('preview').src='data:image/png;base64,'+page.image;$('filename').textContent=f.name;$('filesize').textContent=`PDF · ${d.pages} 页 · ${(f.size/1024/1024).toFixed(1)} MB`;$('attachment').hidden=false;$('pdf-options').hidden=false;$('page-start').value=1;$('page-end').value=d.pages;$('page-start').max=$('page-end').max=d.pages;$('page-total').textContent=`共 ${d.pages} 页，逐页识别`;message('');}catch(e){message(e.message||'PDF读取失败。')}finally{preparing=false;$('send').disabled=false}}
async function streamPage(img,prompt,keepWarm,signal){const r=await fetch('/api/ocr',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:img,prompt,keep_warm:keepWarm,provider:activeProvider,cloud_consent:$('cloud-consent').checked}),signal});if(!r.ok){const d=await r.json();throw new Error(d.error||'识别失败')}const reader=r.body.getReader(),decoder=new TextDecoder();let pending='',done=false;const handle=line=>{if(!line.trim())return;const d=JSON.parse(line);if(d.error)throw new Error(d.error);if(d.response){raw+=d.response;$('result').textContent=clean(raw);$('empty').hidden=!!clean(raw).trim()}if(d.done){done=true;if(d.done_reason==='length')message('部分页面达到输出长度上限，内容可能不完整，请缩小识别范围或分段处理。')}};while(true){const part=await reader.read();pending+=decoder.decode(part.value||new Uint8Array(),{stream:!part.done});let at;while((at=pending.indexOf('\n'))>=0){handle(pending.slice(0,at));pending=pending.slice(at+1)}if(part.done){if(pending.trim())handle(pending);break}}if(!done)throw new Error('连接提前结束，结果可能不完整。')}
$('form').onsubmit=async e=>{e.preventDefault();if(busy||preparing)return;if(!image&&!pdf)return message('请先添加图片或PDF。');let first=1,last=1;if(pdf){first=Number($('page-start').value);last=Number($('page-end').value);if(!Number.isInteger(first)||!Number.isInteger(last)||first<1||last<first||last>pdf.pages)return message('请输入有效的起止页码。')}const selected=$('mode').value;let prompt=$('prompt').value.trim();if(selected==='custom'&&!prompt)return message('请填写识别要求。');prompt=prompt||defaults[selected]||defaults.text;activeProvider=$('provider').value;if(!$('cloud-consent').checked)return message('请先勾选允许发送至所选平台，再开始识别。');controls(true);await check();if(!ready){controls(false);return message('请联系管理员配置所选平台的 API 密钥。')}exportState={name:file?.name||'识别结果',token:pdf?.token||null,image:pdf?null:image,pages:[]};raw='';$('result').textContent='';$('empty').hidden=false;$('empty').textContent='正在准备识别…首次加载可能需要一点时间。';message('');document.body.classList.add('has-result');controller=new AbortController();const start=Date.now();let completed=0;currentLabel='准备识别';$('page-start').disabled=$('page-end').disabled=$('cloud-consent').disabled=true;timer=setInterval(()=>{$('progress').innerHTML='<span class="spinner"></span>'+currentLabel+' · '+Math.floor((Date.now()-start)/1000)+' 秒'},1000);try{for(let page=first;page<=last;page++){controller.signal.throwIfAborted();let input=image;if(pdf){currentLabel=`第 ${page} / ${pdf.pages} 页（已完成 ${completed} 页）`;const r=await fetch(`/api/pdf-page?token=${encodeURIComponent(pdf.token)}&page=${page}`,{signal:controller.signal});const d=await r.json();if(!r.ok)throw new Error(d.error);input=d.image;$('preview').src='data:image/png;base64,'+input;raw+=(raw?'\n\n---\n\n':'')+`## 第 ${page} 页\n\n`;}else{currentLabel='识别中'}const offset=raw.length;const record={page,text:''};exportState.pages.push(record);try{await streamPage(input,prompt,pdf&&page<last,controller.signal);completed++;}finally{record.text=clean(raw.slice(offset));}}$('progress').textContent=`已完成${pdf?' '+completed+' 页':''} · ${Math.floor((Date.now()-start)/1000)} 秒`;if(!clean(raw).trim())$('empty').textContent='未识别到文字。'}catch(err){const stopped=err.name==='AbortError';$('progress').textContent=(stopped?'已停止':'识别未完成')+(pdf?` · 已完成 ${completed} 页`:'');message(stopped?'已停止，已生成内容可以复制或下载。':err.message);if(!clean(raw).trim())$('empty').textContent=stopped?'识别已停止。':'请检查提示后重试。'}finally{clearInterval(timer);controls(false);controller=null;$('page-start').disabled=$('page-end').disabled=$('cloud-consent').disabled=false}};
$('stop').onclick=()=>controller?.abort();$('reset').onclick=()=>{if(busy)return;document.body.classList.remove('has-result');$('remove').click();exportState=null;raw='';$('result').textContent='';$('prompt').value='';$('prompt').style.height='auto';message('');controls(false)};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(clean(raw));$('copy').textContent='已复制';setTimeout(()=>$('copy').textContent='复制文字',1800)}catch{message('复制失败，请直接选择结果文字复制。')}};
$('download').onclick=()=>{const url=URL.createObjectURL(new Blob([clean(raw)],{type:'text/markdown;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=(file?.name||'识别结果').replace(/\.[^.]+$/,'')+'.md';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};


$('word').onclick=async()=>{if(!exportState?.pages.length||busy)return;const state=exportState;$('word').disabled=true;$('word').textContent='正在生成…';message('正在生成Word，请稍候。原始页面将保留签名和印章。');try{const r=await fetch('/api/export-word',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({...state,mode:$('word-mode').value})});const data=await r.json();if(!r.ok)throw new Error(data.error);let finished=false;for(let poll=0;poll<600;poll++){const statusResponse=await fetch('/api/word-status?id='+encodeURIComponent(data.id));const job=await statusResponse.json();if(!statusResponse.ok||job.state==='error')throw new Error(job.error||'生成失败，请重试。');if(job.state==='done'){const a=document.createElement('a');a.href=job.url;a.download=state.name.replace(/\.[^.]+$/,'')+'_识别结果.docx';document.body.appendChild(a);a.click();a.remove();message('Word已生成，已开始下载。若未弹出下载，可点击下方链接重试。');const link=document.createElement('a');link.href=job.url;link.download='识别结果.docx';link.textContent='再次下载 Word';link.style.cssText='display:inline-block;margin-left:12px;color:#527fa9';$('message').appendChild(link);finished=true;break;}await new Promise(resolve=>setTimeout(resolve,1000))}if(!finished)throw new Error('生成时间较长，请稍后重试。')}catch(e){message(e instanceof TypeError?'连接在线服务失败，请稍后重试。':e.message||'导出失败，请重试。')}finally{$('word').textContent='导出 Word';$('word').disabled=busy||!exportState?.pages.length}};

$('provider').onchange=()=>{const cloud=true;$('cloud-note').hidden=!cloud;$('cloud-consent').checked=false;$('cloud-name').textContent=$('provider').value==='mimo'?'小米 MiMo':'DeepSeek';$('privacy-hint').textContent=cloud?'文件由本站服务器处理；所选页面发送至模型平台，临时文件最长保留24小时':'文件由本站服务器处理，所选页面会发送至模型平台';check()};
$('provider').onchange();
</script>
</body></html>
